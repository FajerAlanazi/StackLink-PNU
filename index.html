<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StackLink PNU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{
  --teal:#2F7F8C; --teal-d:#22636D; --teal-l:#E3F1F3; --lav:#A9B4D9; --lav-l:#EEF0F9; --navy:#1E2A3A;
  --ink:#1F2933; --muted:#667085; --line:#E4E7EC; --bg:#F6F8FA; --card:#fff;
  --study:#3B6FB6; --study-l:#E7EFFA; --hack:#B4590F; --hack-l:#FDF0E3; --grad:#6B4FA0; --grad-l:#F0EBF8;
  --ok:#1E8E5A; --err:#C0392B; --warn:#B7791F; --warn-l:#FEF6E4;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
a{color:var(--teal-d)}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em} h2{font-size:18px;margin:0 0 14px} h3{font-size:15px;margin:14px 0 8px} h4{font-size:13px;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.container{max-width:1120px;margin:0 auto;padding:28px 20px 40px}
.muted{color:var(--muted)} .small{font-size:13px}
/* top bar */
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:28px;padding:12px 28px;background:var(--navy);color:#fff}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:19px;font-weight:600}
.brand b{color:var(--lav)} .logo{width:34px;height:34px}
#nav{display:flex;gap:4px;flex:1}
#nav a{color:#C9D3E0;text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px}
#nav a:hover{background:rgba(255,255,255,.08);color:#fff} #nav a.active{background:var(--teal);color:#fff}
.user-chip{display:flex;align-items:center;gap:10px;font-size:14px}
.link-btn{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
/* avatars */
.avatar{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#4F6D8F);color:#fff;font-weight:700;flex:none}
.avatar.sm{width:32px;height:32px;font-size:13px} .avatar.xs{width:24px;height:24px;font-size:10px;margin-right:8px}
/* cards & layout */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start} .grid-2.even{grid-template-columns:1fr 1fr}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px} .row-3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:14px}
.form-wide{max-width:820px}
/* forms */
label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px;color:#344054}
.hint{font-weight:400;color:var(--muted)}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid #D0D5DD;border-radius:10px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(47,127,140,.15)}
.invalid{border-color:var(--err)!important;background:#FFF8F7}
.field-error{display:block;color:var(--err);font-size:12.5px;min-height:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;border:1px solid #D0D5DD;background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;margin-top:14px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff} .btn.primary:hover{background:var(--teal-d)}
.btn.ghost{background:transparent} .btn.full{width:100%}
.actions{display:flex;justify-content:flex-end;gap:10px}
.pill-group{display:flex;gap:8px;flex-wrap:wrap}
.pill-radio{margin:0} .pill-radio input{display:none}
.pill-radio span{display:inline-block;padding:8px 16px;border:1px solid #D0D5DD;border-radius:999px;font-weight:500;cursor:pointer;background:#fff}
.pill-radio input:checked+span{background:var(--teal-l);border-color:var(--teal);color:var(--teal-d)}
.cat-group{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat-option{margin:0} .cat-option input{display:none}
.cat-option span{display:block;text-align:center;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;cursor:pointer}
.cat-study input:checked+span{border-color:var(--study);background:var(--study-l);color:var(--study)}
.cat-hack input:checked+span{border-color:var(--hack);background:var(--hack-l);color:var(--hack)}
.cat-grad input:checked+span{border-color:var(--grad);background:var(--grad-l);color:var(--grad)}
.role-input{border:1px solid #D0D5DD;border-radius:10px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.role-input input{border:none;flex:1;min-width:180px;margin:0;box-shadow:none!important}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--teal-l);color:var(--teal-d);font-size:13px;margin-right:6px}
/* tags & chips */
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid #D0D5DD;background:#fff;border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;color:#344054}
.tag.on{background:var(--teal);border-color:var(--teal);color:#fff} .tag.on::before{content:"✓ "}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:500}
.chip.tech{background:var(--teal-l);color:var(--teal-d)} .chip.soft{background:var(--lav-l);color:#4F5B8F} .chip.role{background:#F2F4F7;color:#344054}
.chip button{border:none;background:none;cursor:pointer;font-size:15px;line-height:1;color:var(--muted)}
/* badges */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.cat-study.badge{background:var(--study-l);color:var(--study)} .cat-hack.badge{background:var(--hack-l);color:var(--hack)} .cat-grad.badge{background:var(--grad-l);color:var(--grad)}
.badge.pending{background:var(--warn-l);color:var(--warn)} .badge.mine{background:var(--lav-l);color:#4F5B8F} .badge.big{font-size:15px;padding:8px 16px}
/* browse */
.filters{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;color:#344054}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.search{max-width:320px;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:8px}
.req-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:6px}
.req-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,24,40,.1)}
.req-card h3{margin:6px 0 0;font-size:17px} .req-top{display:flex;justify-content:space-between;gap:8px}
.meta{margin:4px 0;color:#475467;font-size:13.5px}
.req-foot{display:flex;flex-direction:column;gap:2px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.owner{display:flex;align-items:center;font-weight:600;font-size:13.5px}
/* profile */
.preview{position:sticky;top:84px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:700;margin:0 0 12px}
.pc-top{display:flex;gap:12px;align-items:center} .pc-top h3{margin:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.facts.wide{grid-template-columns:repeat(2,1fr)}
.facts div{background:var(--bg);border-radius:10px;padding:8px 10px} .facts dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em} .facts dd{margin:2px 0 0;font-weight:600;font-size:14px}
.bio{color:#344054;font-size:14px}
.notice{background:var(--lav-l);border:1px solid #D5DAF0;border-radius:12px;padding:12px 16px;margin-bottom:16px}
.status-box{text-align:center} .back{display:inline-block;margin-bottom:14px;text-decoration:none;font-weight:600}
.req-title{margin:10px 0}
.applicants,.act-list{list-style:none;padding:0;margin:0}
.applicants li,.act-list li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.act-list a{font-weight:600;margin-right:auto}
.empty{text-align:center;padding:40px}
/* auth */
.auth{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;min-height:70vh}
.auth-intro h1{font-size:44px;line-height:1.1;color:var(--navy)} .auth-intro h1 span{color:var(--teal)}
.auth-intro p{font-size:16px;color:#475467;max-width:520px}
.intro-points{list-style:none;padding:0} .intro-points li{padding:8px 0 8px 30px;position:relative} .intro-points li::before{content:"";position:absolute;left:0;top:13px;width:16px;height:16px;border-radius:4px;background:var(--lav)}
.auth-card{max-width:420px} .demo{font-size:13px;color:var(--muted);text-align:center}
/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)} .toast.err{background:var(--err)}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:20px}
@media (max-width:820px){.grid-2,.grid-2.even,.auth,.row-3{grid-template-columns:1fr}.topbar{flex-wrap:wrap;gap:10px;padding:10px 16px}#nav{order:3;width:100%;overflow-x:auto}.cat-group{grid-template-columns:1fr}.preview{position:static}.auth-intro h1{font-size:32px}}

.date-select{display:grid;grid-template-columns:.8fr 1.1fr 1fr;gap:6px}
.date-select select{margin-top:0;padding:10px 8px}

/* ---------- Sprint 2 ---------- */
.bell{position:relative;text-decoration:none;font-size:18px;padding:4px 8px;border-radius:999px}
.bell.active,.bell:hover{background:rgba(255,255,255,.1)}
.bell-count{position:absolute;top:-4px;right:-4px;background:#E5484D;color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.badge.st-ok{background:#E3F4EA;color:#1E7A4C}.badge.st-no{background:#FDECEC;color:#B42318}.badge.st-pending{background:var(--warn-l);color:var(--warn)}
.badge.st-full{background:#FFF1E6;color:#B4590F}.badge.st-done{background:var(--lav-l);color:#4F5B8F}.badge.st-muted-b{background:#F2F4F7;color:#667085}
.btn.sm{padding:6px 12px;font-size:13px;margin-top:0}.btn.danger{color:#B42318;border-color:#F3C6C3}.btn.danger:hover{background:#FDECEC}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tool-btns{display:flex;flex-wrap:wrap;gap:8px}.tool-btns .btn{margin-top:10px}
.status-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meter{height:8px;background:#EEF2F5;border-radius:999px;overflow:hidden;margin:4px 0 6px}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#4C9AA6)}
.chip.member{background:#fff;border:1px solid var(--line);padding:3px 10px 3px 4px}.chip.member .avatar.xs{margin-right:6px}
.applicants li{align-items:flex-start}.ap-main{display:flex;flex-direction:column;flex:1;min-width:200px}.ap-msg{font-style:italic;color:#475467;font-size:13.5px;margin-top:2px}
.ap-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.reminder{background:var(--warn-l);border:1px solid #F5DDA7;color:#7A5410;border-radius:12px;padding:12px 16px;margin-bottom:18px}
.collab-list,.notif-list{list-style:none;padding:0;margin:0}
.collab{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.collab.soon{background:linear-gradient(90deg,#FFF9EC,transparent)}
.cal{width:52px;height:56px;border-radius:12px;background:var(--teal-l);color:var(--teal-d);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.cal b{font-size:20px;line-height:1}.cal span{font-size:12px;text-transform:uppercase;font-weight:700}
.c-main{display:flex;flex-direction:column;flex:1}.c-main a{text-decoration:none}
.notif-list li{display:flex;justify-content:space-between;gap:14px;padding:12px 10px;border-bottom:1px solid var(--line);border-radius:8px}
.notif-list li.unread{background:var(--teal-l)}.notif-list a{text-decoration:none;color:var(--ink);font-weight:500}

</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/browse">
      <svg viewBox="0 0 40 40" width="34" height="34" class="logo" aria-hidden="true">
        <rect x="4" y="4" width="14" height="14" rx="3" fill="#4F6D8F"/><rect x="22" y="4" width="14" height="14" rx="3" fill="#2F7F8C"/>
        <rect x="4" y="22" width="14" height="14" rx="3" fill="#A9B4D9"/><rect x="22" y="22" width="14" height="14" rx="3" fill="#4C9AA6"/>
        <circle cx="20" cy="20" r="6" fill="#fff"/><circle cx="20" cy="20" r="3" fill="#2F7F8C"/>
      </svg>
      <span>StackLink <b>PNU</b></span>
    </a>
    <nav id="nav"></nav>
    <div id="user-chip" class="user-chip"></div>
  </header>
  <main id="view" class="container"></main>
  <footer class="foot">StackLink PNU · CS 388T Sprint 2 release · <a href="#" id="reset">Reset demo data</a></footer>
  <script>
/* =========================================================
   StackLink PNU – Data Service (Sprint 1 + Sprint 2)
   Acts as the application's back-end layer: it stores data,
   validates input and enforces business rules.
   Data is persisted in the browser (localStorage).
   ========================================================= */

const Store = (() => {
  const KEY = "stacklink_pnu_v2";
  const PNU_DOMAIN = "@pnu.edu.sa";

  const CATEGORIES = ["Study Session", "Hackathon", "Graduation Project"];
  // Bachelor programs of the College of Computer and Information Sciences (pnu.edu.sa)
  const MAJORS = ["Computer Science", "Information Systems", "Information Technology", "Artificial Intelligence Sciences",
    "Data Science and Analytics", "Software Engineering", "Cybersecurity", "Internet of Things"];
  const LEVELS = ["Level 1", "Level 2", "Level 3", "Level 4", "Level 5", "Level 6", "Level 7", "Level 8"];
  const WORK_MODES = ["Online", "In-person", "Hybrid"];
  const TECH_SKILLS = ["Python", "Java", "JavaScript", "HTML/CSS", "React", "Flutter", "SQL / Databases",
    "UI/UX Design", "Machine Learning", "Data Analysis", "Cybersecurity", "Networking", "Testing / QA", "Git"];
  const SOFT_SKILLS = ["Leadership", "Communication", "Time Management", "Problem Solving",
    "Presentation", "Teamwork", "Organization", "Creativity"];

  let memory = null; // fallback if localStorage is blocked

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); d.notifications = d.notifications || []; return d; }
    } catch (e) { if (memory) return memory; }
    const seeded = seed();
    save(seeded);
    return seeded;
  }

  function save(db) {
    memory = db;
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* in-memory only */ }
  }

  function uid(prefix) {
    return prefix + "-" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
  }

  /* ---------- sample data so the platform is not empty ---------- */
  function seed() {
    const users = [
      { id: "u-sara", name: "Sara Alharbi", email: "sara.alharbi@pnu.edu.sa", major: "Computer Science", level: "Level 7",
        workMode: "Hybrid", bio: "Interested in web development and graduation project planning. I like clear task lists and weekly check-ins.",
        techSkills: ["JavaScript", "React", "UI/UX Design"], softSkills: ["Organization", "Communication"], completedCount: 1 },
      { id: "u-lama", name: "Lama Alqahtani", email: "lama.alqahtani@pnu.edu.sa", major: "Artificial Intelligence Sciences", level: "Level 5",
        workMode: "Online", bio: "Hackathon lover. Backend and databases are my thing.",
        techSkills: ["Python", "SQL / Databases", "Git"], softSkills: ["Problem Solving", "Teamwork"], completedCount: 2 },
      { id: "u-nouf", name: "Nouf Alshehri", email: "nouf.alshehri@pnu.edu.sa", major: "Software Engineering", level: "Level 3",
        workMode: "In-person", bio: "Looking for study partners for Data Structures and Discrete Math.",
        techSkills: ["Java", "Data Analysis"], softSkills: ["Time Management", "Presentation"], completedCount: 0 }
    ];
    const now = new Date();
    const inDays = d => { const x = new Date(now); x.setDate(x.getDate() + d); return x.toISOString().slice(0, 10); };
    const ago = h => new Date(now.getTime() - h * 3600e3).toISOString();
    const requests = [
      { id: "r-1", ownerId: "u-sara", category: "Graduation Project", title: "Smart Campus Navigation App",
        description: "Building a graduation project team for an indoor navigation app for PNU buildings.",
        date: inDays(10), locationType: "Offline", location: "Building 7 – Library", roles: ["Front-end Developer", "Back-end Developer", "UI/UX Designer"],
        maxSize: 4, seeking: "Team", status: "Open", createdAt: ago(72) },
      { id: "r-2", ownerId: "u-lama", category: "Hackathon", title: "AI for Health Hackathon",
        description: "Need teammates for a 48-hour hackathon focused on AI solutions for healthcare.",
        date: inDays(6), locationType: "Online", location: "Microsoft Teams", roles: ["Machine Learning", "Presenter"],
        maxSize: 3, seeking: "Team", status: "Open", createdAt: ago(48) },
      { id: "r-3", ownerId: "u-nouf", category: "Study Session", title: "Data Structures Midterm Review",
        description: "Weekly study session to solve past exam questions together.",
        date: inDays(1), locationType: "Offline", location: "Building 1 – Study Room 12", roles: ["Study Partner"],
        maxSize: 5, seeking: "Partner", status: "Open", createdAt: ago(40) },
      { id: "r-4", ownerId: "u-sara", category: "Study Session", title: "Database Systems Lab Practice",
        description: "Practicing SQL queries before the lab exam.",
        date: inDays(-2), locationType: "Online", location: "Zoom", roles: ["Study Partner"],
        maxSize: 4, seeking: "Partner", status: "Closed", createdAt: ago(200) },
      { id: "r-5", ownerId: "u-lama", category: "Hackathon", title: "PNU Data Day Mini-Hackathon",
        description: "One-day hackathon on open data dashboards.",
        date: inDays(-12), locationType: "Offline", location: "Building 6 – Innovation Lab", roles: ["Data Analyst", "Front-end Developer"],
        maxSize: 3, seeking: "Team", status: "Completed", createdAt: ago(500) }
    ];
    const joinRequests = [
      { id: "j-1", requestId: "r-1", userId: "u-lama", message: "I can handle the back-end and the database.", status: "Pending", createdAt: ago(20) },
      { id: "j-2", requestId: "r-1", userId: "u-nouf", message: "I would like to help with testing and documentation.", status: "Accepted", createdAt: ago(30), decidedAt: ago(26) },
      { id: "j-3", requestId: "r-3", userId: "u-sara", message: "", status: "Accepted", createdAt: ago(30), decidedAt: ago(28) },
      { id: "j-4", requestId: "r-5", userId: "u-sara", message: "", status: "Accepted", createdAt: ago(480), decidedAt: ago(470) }
    ];
    const notifications = [
      { id: "n-1", userId: "u-sara", text: "Lama Alqahtani sent a join request to “Smart Campus Navigation App”.", link: "#/request/r-1", read: false, createdAt: ago(20) },
      { id: "n-2", userId: "u-sara", text: "Nouf Alshehri accepted your request to join “Data Structures Midterm Review”.", link: "#/request/r-3", read: true, createdAt: ago(28) }
    ];
    return { users, requests, joinRequests, notifications, currentUserId: null };
  }

  /* ---------- helpers ---------- */
  const db = () => load();
  const get = (list, id) => db()[list].find(x => x.id === id);

  function currentUser() {
    const d = db();
    return d.users.find(u => u.id === d.currentUserId) || null;
  }

  function isProfileComplete(u) {
    return !!(u && u.major && u.level && u.workMode && u.bio && u.bio.trim().length >= 10);
  }

  /* ---------- account (supports PB-01) ---------- */
  function signIn(name, email) {
    const errors = {};
    email = (email || "").trim().toLowerCase();
    name = (name || "").trim();
    if (!email) errors.email = "Email is required.";
    else if (!email.endsWith(PNU_DOMAIN)) errors.email = "Please use your PNU university email (" + PNU_DOMAIN + ").";
    const d = db();
    let user = d.users.find(u => u.email === email);
    if (!user && !name) errors.name = "Name is required for a new account.";
    if (Object.keys(errors).length) return { ok: false, errors };
    if (!user) {
      user = { id: uid("u"), name, email, major: "", level: "", workMode: "", bio: "", techSkills: [], softSkills: [], completedCount: 0 };
      d.users.push(user);
    }
    d.currentUserId = user.id;
    save(d);
    return { ok: true, user, isNew: !isProfileComplete(user) };
  }

  function signOut() { const d = db(); d.currentUserId = null; save(d); }

  /* ---------- PB-01: create / edit profile ---------- */
  function saveProfile(data) {
    const errors = {};
    if (!MAJORS.includes(data.major)) errors.major = "Please choose your major.";
    if (!LEVELS.includes(data.level)) errors.level = "Please choose your academic level.";
    if (!WORK_MODES.includes(data.workMode)) errors.workMode = "Please choose a preferred work mode.";
    if (!data.bio || data.bio.trim().length < 10) errors.bio = "Bio must be at least 10 characters.";
    else if (data.bio.length > 300) errors.bio = "Bio must be 300 characters or less.";
    if (Object.keys(errors).length) return { ok: false, errors };
    const d = db();
    const u = d.users.find(x => x.id === d.currentUserId);
    Object.assign(u, { major: data.major, level: data.level, workMode: data.workMode, bio: data.bio.trim() });
    save(d);
    return { ok: true, user: u };
  }

  /* ---------- PB-02: skills with predefined tags ---------- */
  function saveSkills(tech, soft) {
    const t = (tech || []).filter(s => TECH_SKILLS.includes(s));
    const s = (soft || []).filter(x => SOFT_SKILLS.includes(x));
    const d = db();
    const u = d.users.find(x => x.id === d.currentUserId);
    u.techSkills = [...new Set(t)];
    u.softSkills = [...new Set(s)];
    save(d);
    return { ok: true, user: u };
  }

  /* ---------- PB-03: create collaboration request ---------- */
  function validateRequest(data) {
    const errors = {};
    const today = new Date().toISOString().slice(0, 10);
    if (!CATEGORIES.includes(data.category)) errors.category = "Choose a category.";
    if (!data.title || data.title.trim().length < 5) errors.title = "Title must be at least 5 characters.";
    if (!data.date) errors.date = "Date is required.";
    else if (data.date === "invalid") errors.date = "This date does not exist.";
    else if (data.date < today) errors.date = "Date cannot be in the past.";
    if (!["Online", "Offline"].includes(data.locationType)) errors.locationType = "Choose online or offline.";
    if (!data.location || !data.location.trim()) errors.location = data.locationType === "Online" ? "Add the meeting platform or link." : "Add the place.";
    const roles = (data.roles || []).map(r => r.trim()).filter(Boolean);
    if (!roles.length) errors.roles = "Add at least one needed role.";
    const size = parseInt(data.maxSize, 10);
    if (!(size >= 2 && size <= 10)) errors.maxSize = "Group size must be between 2 and 10.";
    if (!["Partner", "Team"].includes(data.seeking)) errors.seeking = "Choose partner or team.";
    return { errors, roles, size };
  }

  function createRequest(data) {
    const { errors, roles, size } = validateRequest(data);
    if (Object.keys(errors).length) return { ok: false, errors };
    const d = db();
    const req = {
      id: uid("r"), ownerId: d.currentUserId, category: data.category, title: data.title.trim(),
      description: (data.description || "").trim(), date: data.date, locationType: data.locationType,
      location: data.location.trim(), roles, maxSize: size, seeking: data.seeking, status: "Open",
      createdAt: new Date().toISOString()
    };
    d.requests.unshift(req);
    save(d);
    return { ok: true, request: req };
  }

  /* ---------- PB-04: browse & filter active requests ---------- */
  function listActive({ category = "All", query = "" } = {}) {
    const today = new Date().toISOString().slice(0, 10);
    const q = query.trim().toLowerCase();
    return db().requests
      .filter(r => r.status === "Open" && r.date >= today)
      .filter(r => category === "All" || r.category === category)
      .filter(r => !q || (r.title + " " + r.description + " " + r.roles.join(" ")).toLowerCase().includes(q))
      .sort((a, b) => a.date.localeCompare(b.date));
  }

  function myRequests() {
    const d = db();
    return d.requests.filter(r => r.ownerId === d.currentUserId);
  }

  /* ---------- PB-05: send join request ---------- */
  function joinStatus(requestId) {
    const d = db();
    const j = d.joinRequests.filter(x => x.requestId === requestId && x.userId === d.currentUserId).pop();
    return j && j.status !== "Withdrawn" ? j.status : null;
  }

  function sendJoinRequest(requestId, message) {
    const d = db();
    const req = d.requests.find(r => r.id === requestId);
    if (!req || req.status !== "Open") return { ok: false, error: "This request is no longer active." };
    if (req.ownerId === d.currentUserId) return { ok: false, error: "You cannot join your own request." };
    if (d.joinRequests.some(x => x.requestId === requestId && x.userId === d.currentUserId && x.status !== "Withdrawn"))
      return { ok: false, error: "You already sent a join request for this collaboration." };
    const j = { id: uid("j"), requestId, userId: d.currentUserId, message: (message || "").trim(), status: "Pending", createdAt: new Date().toISOString() };
    d.joinRequests.push(j);
    const me = d.users.find(u => u.id === d.currentUserId);
    notify(d, req.ownerId, `${me.name} sent a join request to “${req.title}”.`, "#/request/" + req.id);   // PB-09
    save(d);
    return { ok: true, join: j };
  }

  function myJoinRequests() {
    const d = db();
    return d.joinRequests.filter(j => j.userId === d.currentUserId)
      .map(j => ({ ...j, request: d.requests.find(r => r.id === j.requestId) }));
  }

  function applicantsFor(requestId) {
    const d = db();
    return d.joinRequests.filter(j => j.requestId === requestId)
      .map(j => ({ ...j, user: d.users.find(u => u.id === j.userId) }));
  }

  /* ---------- team size helpers (PB-10) ---------- */
  function memberCount(requestId) {   // the owner counts as a member
    return 1 + db().joinRequests.filter(j => j.requestId === requestId && j.status === "Accepted").length;
  }
  function membersOf(requestId) {
    const d = db(); const r = d.requests.find(x => x.id === requestId);
    const ids = [r.ownerId, ...d.joinRequests.filter(j => j.requestId === requestId && j.status === "Accepted").map(j => j.userId)];
    return ids.map(id => d.users.find(u => u.id === id));
  }

  /* ---------- PB-09: notifications ---------- */
  function notify(d, userId, text, link) {
    d.notifications.unshift({ id: uid("n"), userId, text, link, read: false, createdAt: new Date().toISOString() });
  }
  function myNotifications() {
    const d = db(); return d.notifications.filter(n => n.userId === d.currentUserId);
  }
  function unreadCount() { return myNotifications().filter(n => !n.read).length; }
  function markAllRead() {
    const d = db(); d.notifications.forEach(n => { if (n.userId === d.currentUserId) n.read = true; }); save(d);
  }

  /* ---------- PB-06 + PB-07: review applicants, accept or decline ---------- */
  function decideJoin(joinId, decision) {
    const d = db();
    const j = d.joinRequests.find(x => x.id === joinId);
    if (!j) return { ok: false, error: "Join request not found." };
    const r = d.requests.find(x => x.id === j.requestId);
    if (r.ownerId !== d.currentUserId) return { ok: false, error: "Only the request owner can decide." };
    if (j.status !== "Pending") return { ok: false, error: "This join request was already handled." };
    if (!["Accepted", "Declined"].includes(decision)) return { ok: false, error: "Unknown decision." };
    if (decision === "Accepted" && memberCount(r.id) >= r.maxSize)
      return { ok: false, error: "The team is already full." };                       // PB-10
    j.status = decision; j.decidedAt = new Date().toISOString();
    notify(d, j.userId, decision === "Accepted"
      ? `Your request to join “${r.title}” was accepted. 🎉`
      : `Your request to join “${r.title}” was declined.`, "#/request/" + r.id);
    save(d);
    // PB-10: close the request automatically when the team is full
    if (decision === "Accepted" && memberCount(r.id) >= r.maxSize) {
      const d2 = db(); const r2 = d2.requests.find(x => x.id === r.id);
      r2.status = "Full";
      notify(d2, r2.ownerId, `“${r2.title}” reached the maximum group size (${r2.maxSize}). It is no longer shown in Browse.`, "#/request/" + r2.id);
      save(d2);
      return { ok: true, full: true };
    }
    return { ok: true, full: false };
  }

  /* ---------- PB-08: withdraw a pending join request ---------- */
  function withdrawJoin(requestId) {
    const d = db();
    const j = d.joinRequests.find(x => x.requestId === requestId && x.userId === d.currentUserId && x.status === "Pending");
    if (!j) return { ok: false, error: "Only pending requests can be withdrawn." };
    j.status = "Withdrawn"; j.decidedAt = new Date().toISOString();
    save(d);
    return { ok: true };
  }

  /* ---------- PB-20: edit or close a request ---------- */
  function updateRequest(id, data) {
    const d = db(); const r = d.requests.find(x => x.id === id);
    if (!r || r.ownerId !== d.currentUserId) return { ok: false, errors: { title: "Only the owner can edit this request." } };
    if (["Closed", "Completed"].includes(r.status)) return { ok: false, errors: { title: "Closed or completed requests cannot be edited." } };
    const { errors, roles, size } = validateRequest(data);
    if (!errors.maxSize && size < memberCount(id)) errors.maxSize = `The team already has ${memberCount(id)} members.`;
    if (Object.keys(errors).length) return { ok: false, errors };
    Object.assign(r, { category: data.category, title: data.title.trim(), description: (data.description || "").trim(), date: data.date,
      locationType: data.locationType, location: data.location.trim(), roles, maxSize: size, updatedAt: new Date().toISOString() });
    r.status = memberCount(id) >= size ? "Full" : "Open";
    d.joinRequests.filter(j => j.requestId === id && ["Pending", "Accepted"].includes(j.status))
      .forEach(j => notify(d, j.userId, `“${r.title}” was updated by the owner. Please check the new details.`, "#/request/" + id));
    save(d);
    return { ok: true, request: r };
  }
  function closeRequest(id) {
    const d = db(); const r = d.requests.find(x => x.id === id);
    if (!r || r.ownerId !== d.currentUserId) return { ok: false, error: "Only the owner can close this request." };
    r.status = "Closed";
    d.joinRequests.filter(j => j.requestId === id && j.status === "Pending").forEach(j => {
      j.status = "Declined"; j.decidedAt = new Date().toISOString();
      notify(d, j.userId, `“${r.title}” was closed by the owner.`, "#/request/" + id);
    });
    save(d);
    return { ok: true };
  }

  /* ---------- PB-12: confirmed collaborations ---------- */
  function myCollaborations() {
    const d = db(); const me = d.currentUserId;
    return d.requests.filter(r => {
      const accepted = d.joinRequests.some(j => j.requestId === r.id && j.status === "Accepted");
      const iAmMember = d.joinRequests.some(j => j.requestId === r.id && j.userId === me && j.status === "Accepted");
      return r.status !== "Closed" && ((r.ownerId === me && accepted) || iAmMember);
    }).sort((a, b) => a.date.localeCompare(b.date));
  }

  /* ---------- PB-14: reminders before a confirmed collaboration ---------- */
  function daysUntil(iso) {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((new Date(iso + "T00:00:00") - t) / 86400000);
  }
  function generateReminders() {
    const d = db(); const me = d.currentUserId; if (!me) return 0;
    d.reminders = d.reminders || [];
    let added = 0;
    myCollaborations().forEach(r => {
      const left = daysUntil(r.date);
      const key = me + ":" + r.id;
      if (r.status !== "Completed" && left >= 0 && left <= 2 && !d.reminders.includes(key)) {
        d.reminders.push(key);
        notify(d, me, `⏰ Reminder: “${r.title}” is ${left === 0 ? "today" : left === 1 ? "tomorrow" : "in 2 days"} – ${r.location}.`, "#/request/" + r.id);
        added++;
      }
    });
    if (added) save(d);
    return added;
  }

  /* ---------- PB-15: mark a collaboration as completed ---------- */
  function completeCollaboration(id) {
    const d = db(); const r = d.requests.find(x => x.id === id);
    if (!r || r.ownerId !== d.currentUserId) return { ok: false, error: "Only the owner can mark it as completed." };
    if (r.status === "Completed") return { ok: false, error: "Already completed." };
    const members = d.joinRequests.filter(j => j.requestId === id && j.status === "Accepted").map(j => j.userId);
    if (!members.length) return { ok: false, error: "Accept at least one member before completing the collaboration." };
    r.status = "Completed"; r.completedAt = new Date().toISOString();
    [r.ownerId, ...members].forEach(uidx => { const u = d.users.find(x => x.id === uidx); u.completedCount = (u.completedCount || 0) + 1; });
    d.joinRequests.filter(j => j.requestId === id && j.status === "Pending").forEach(j => { j.status = "Declined"; });
    members.forEach(m => notify(d, m, `✅ “${r.title}” was marked as completed. Your collaboration record was updated.`, "#/request/" + id));
    save(d);
    return { ok: true };
  }

  function reset() { try { localStorage.removeItem(KEY); } catch (e) {} memory = null; return load(); }

  return {
    CATEGORIES, MAJORS, LEVELS, WORK_MODES, TECH_SKILLS, SOFT_SKILLS, PNU_DOMAIN,
    currentUser, isProfileComplete, signIn, signOut, saveProfile, saveSkills,
    createRequest, listActive, myRequests, joinStatus, sendJoinRequest, myJoinRequests,
    applicantsFor, getUser: id => get("users", id), getRequest: id => get("requests", id), reset,
    memberCount, membersOf, myNotifications, unreadCount, markAllRead, decideJoin, withdrawJoin,
    updateRequest, closeRequest, myCollaborations, generateReminders, daysUntil, completeCollaboration
  };
})();

</script>
<script>
/* =========================================================
   StackLink PNU – User Interface (Sprint 1)
   Screens: Sign in · Profile & Skills · Create Request ·
            Browse & Filter · Request Details / Join · My Activity
   ========================================================= */

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const view = () => $("#view");

const CAT_CLASS = { "Study Session": "cat-study", "Hackathon": "cat-hack", "Graduation Project": "cat-grad" };
const CAT_ICON = { "Study Session": "📚", "Hackathon": "⚡", "Graduation Project": "🎓" };

function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function initials(name) { return name.split(" ").map(p => p[0]).slice(0, 2).join("").toUpperCase(); }

function toast(msg, type = "ok") {
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add("show"), 10);
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 2600);
}

function liveClear(form) {
  if (form._live) return; form._live = true;
  const clear = e => { let n = e.target.name; if (!n) return; e.target.classList.remove("invalid");
    const grp = e.target.closest("[data-group]"); if (grp) { n = grp.dataset.group; grp.querySelectorAll("select").forEach(s => s.classList.remove("invalid")); }
    const el = form.querySelector(`[data-error="${n}"]`); if (el) el.textContent = ""; };
  form.addEventListener("input", clear); form.addEventListener("change", clear);
}
function showErrors(form, errors) {
  liveClear(form);
  form.querySelectorAll(".field-error").forEach(e => e.textContent = "");
  form.querySelectorAll(".invalid").forEach(e => e.classList.remove("invalid"));
  Object.entries(errors).forEach(([k, msg]) => {
    const el = form.querySelector(`[data-error="${k}"]`);
    if (el) el.textContent = msg;
    const input = form.querySelector(`[name="${k}"]`);
    if (input) input.classList.add("invalid");
    form.querySelectorAll(`[data-group="${k}"] select`).forEach(s => s.classList.add("invalid"));
  });
}

/* ---------------- header ---------------- */
function renderHeader() {
  const u = Store.currentUser();
  const nav = $("#nav");
  const user = $("#user-chip");
  if (!u) { nav.innerHTML = ""; user.innerHTML = ""; return; }
  const route = location.hash.split("/")[1] || "browse";
  const link = (r, label) => `<a href="#/${r}" class="${route === r ? "active" : ""}">${label}</a>`;
  nav.innerHTML = link("browse", "Browse") + link("create", "Create Request") + link("collabs", "My Collaborations") + link("activity", "My Activity") + link("profile", "My Profile");
  const n = Store.unreadCount();
  user.innerHTML = `<a href="#/notifications" class="bell ${route === "notifications" ? "active" : ""}" title="Notifications" aria-label="Notifications">🔔${n ? `<span class="bell-count">${n}</span>` : ""}</a>
    <span class="avatar sm">${esc(initials(u.name))}</span><span class="uname">${esc(u.name.split(" ")[0])}</span>
    <button class="link-btn" id="signout">Sign out</button>`;
  $("#signout").onclick = () => { Store.signOut(); location.hash = "#/login"; };
}

/* ---------------- sign in ---------------- */
function viewLogin() {
  view().innerHTML = `
  <section class="auth">
    <div class="auth-intro">
      <h1>Where minds combine<br><span>&amp; visions refine</span></h1>
      <p>StackLink PNU helps Computer Science students at Princess Nourah University form balanced teams for
      study sessions, hackathons and graduation projects, by seeing skills and preferences <em>before</em> committing.</p>
      <ul class="intro-points">
        <li><b>Build your profile</b> with your level, work mode and skills</li>
        <li><b>Post a request</b> with the roles your team needs</li>
        <li><b>Find and join</b> the right collaboration</li>
      </ul>
    </div>
    <form class="card auth-card" id="login-form" novalidate>
      <h2>Sign in</h2>
      <p class="muted">Use your PNU university email. New students get an account automatically.</p>
      <label>Full name <span class="hint">(new accounts only)</span>
        <input name="name" placeholder="e.g. Fajer Alanazi" autocomplete="name"></label>
      <span class="field-error" data-error="name"></span>
      <label>University email
        <input name="email" type="email" placeholder="name${Store.PNU_DOMAIN}" autocomplete="email"></label>
      <span class="field-error" data-error="email"></span>
      <button class="btn primary full" type="submit">Continue</button>
      <p class="demo">Demo account: <a href="#" id="demo">sara.alharbi${Store.PNU_DOMAIN}</a></p>
    </form>
  </section>`;
  const form = $("#login-form");
  $("#demo").onclick = e => { e.preventDefault(); form.email.value = "sara.alharbi" + Store.PNU_DOMAIN; };
  form.onsubmit = e => {
    e.preventDefault();
    const res = Store.signIn(form.name.value, form.email.value);
    if (!res.ok) return showErrors(form, res.errors);
    toast("Welcome, " + res.user.name.split(" ")[0] + "!");
    location.hash = res.isNew ? "#/profile" : "#/browse";
  };
}

/* ---------------- PB-01 + PB-02: profile & skills ---------------- */
function viewProfile() {
  const u = Store.currentUser();
  const opt = (list, val) => list.map(x => `<option ${x === val ? "selected" : ""}>${x}</option>`).join("");
  const radios = Store.WORK_MODES.map(m => `<label class="pill-radio"><input type="radio" name="workMode" value="${m}" ${u.workMode === m ? "checked" : ""}><span>${m}</span></label>`).join("");
  const tags = (list, chosen, group) => list.map(s => `<button type="button" class="tag ${chosen.includes(s) ? "on" : ""}" data-group="${group}" data-skill="${esc(s)}">${esc(s)}</button>`).join("");
  const incomplete = !Store.isProfileComplete(u);
  view().innerHTML = `
  <div class="page-head">
    <div><h1>My Profile</h1><p class="muted">This is what other students see before teaming up with you.</p></div>
  </div>
  ${incomplete ? `<div class="notice">👋 Complete your profile first so other students can understand your background.</div>` : ""}
  <div class="grid-2">
    <div>
      <form class="card" id="profile-form" novalidate>
        <h2><span class="step">1</span> Academic background</h2>
        <div class="row-2">
          <div><label>Major<select name="major"><option value="">Select…</option>${opt(Store.MAJORS, u.major)}</select></label><span class="field-error" data-error="major"></span></div>
          <div><label>Academic level<select name="level"><option value="">Select…</option>${opt(Store.LEVELS, u.level)}</select></label><span class="field-error" data-error="level"></span></div>
        </div>
        <label>Preferred work mode</label>
        <div class="pill-group">${radios}</div>
        <span class="field-error" data-error="workMode"></span>
        <label>Short bio <span class="hint" id="bio-count"></span>
          <textarea name="bio" rows="3" maxlength="300" placeholder="Interests, working style, what you are looking for…">${esc(u.bio)}</textarea></label>
        <span class="field-error" data-error="bio"></span>
        <button class="btn primary" type="submit">Save profile</button>
      </form>
      <div class="card" id="skills-card">
        <h2><span class="step">2</span> Skills</h2>
        <p class="muted">Choose from the predefined tags so matching is accurate.</p>
        <h3>Technical skills</h3><div class="tags">${tags(Store.TECH_SKILLS, u.techSkills, "tech")}</div>
        <h3>Soft skills</h3><div class="tags">${tags(Store.SOFT_SKILLS, u.softSkills, "soft")}</div>
        <button class="btn primary" id="save-skills">Save skills</button>
      </div>
    </div>
    <aside class="card preview" id="preview"></aside>
  </div>`;
  const form = $("#profile-form");
  const count = () => $("#bio-count").textContent = `${form.bio.value.length}/300`;
  form.bio.oninput = count; count();
  form.onsubmit = e => {
    e.preventDefault();
    const res = Store.saveProfile({ major: form.major.value, level: form.level.value, workMode: (form.workMode.value || ""), bio: form.bio.value });
    if (!res.ok) { showErrors(form, res.errors); toast("Please fix the highlighted fields.", "err"); return; }
    showErrors(form, {}); const n = $(".notice"); if (n) n.remove(); renderPreview(); toast("Profile saved ✔");
  };
  $("#skills-card").querySelectorAll(".tag").forEach(b => b.onclick = () => b.classList.toggle("on"));
  $("#save-skills").onclick = () => {
    const pick = g => [...document.querySelectorAll(`.tag.on[data-group="${g}"]`)].map(b => b.dataset.skill);
    Store.saveSkills(pick("tech"), pick("soft"));
    renderPreview(); toast("Skills saved ✔");
  };
  renderPreview();
}

function profileCard(u) {
  const chips = (arr, cls) => arr.length ? arr.map(s => `<span class="chip ${cls}">${esc(s)}</span>`).join("") : `<span class="muted small">None added yet</span>`;
  return `
    <div class="pc-top"><span class="avatar">${esc(initials(u.name))}</span>
      <div><h3>${esc(u.name)}</h3><p class="muted small">${esc(u.email)}</p></div></div>
    <dl class="facts">
      <div><dt>Major</dt><dd>${esc(u.major || "—")}</dd></div>
      <div><dt>Level</dt><dd>${esc(u.level || "—")}</dd></div>
      <div><dt>Work mode</dt><dd>${esc(u.workMode || "—")}</dd></div>
    </dl>
    <p class="bio">${esc(u.bio || "No bio yet.")}</p>
    <h4>Technical skills</h4><div class="chips">${chips(u.techSkills, "tech")}</div>
    <h4>Soft skills</h4><div class="chips">${chips(u.softSkills, "soft")}</div>`;
}
function renderPreview() {
  $("#preview").innerHTML = `<p class="eyebrow">Profile preview</p>` + profileCard(Store.currentUser());
}

/* ---------------- PB-03 + PB-20: create / edit request ---------------- */
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function viewRequestForm(editId) {
  const u = Store.currentUser();
  if (!Store.isProfileComplete(u)) {
    view().innerHTML = `<div class="card empty"><h2>Complete your profile first</h2><p class="muted">Other students review your profile before joining your request.</p><a class="btn primary" href="#/profile">Go to my profile</a></div>`;
    return;
  }
  const ex = editId ? Store.getRequest(editId) : null;
  if (editId && (!ex || ex.ownerId !== u.id)) { view().innerHTML = `<div class="card empty"><h2>You cannot edit this request</h2><a class="btn" href="#/browse">Back</a></div>`; return; }
  const v = ex || { category: "", title: "", description: "", date: "", locationType: "", location: "", roles: [], maxSize: 4, seeking: "Team" };
  const [yy, mm, dd] = v.date ? v.date.split("-") : ["", "", ""];
  const sel = (a, b) => a === b ? "selected" : "";
  const cats = Store.CATEGORIES.map(c => `<label class="cat-option ${CAT_CLASS[c]}"><input type="radio" name="category" value="${c}" ${v.category === c ? "checked" : ""}><span>${CAT_ICON[c]} ${c}</span></label>`).join("");
  view().innerHTML = `
  ${ex ? `<a class="back" href="#/request/${ex.id}">← Back to the request</a>` : ""}
  <div class="page-head"><div><h1>${ex ? "Edit Collaboration Request" : "Create a Collaboration Request"}</h1><p class="muted">${ex ? "Members and pending applicants will be notified about the changes." : "Describe the opportunity so students can decide before joining."}</p></div></div>
  <form class="card form-wide" id="req-form" novalidate>
    <label>Category</label>
    <div class="cat-group">${cats}</div><span class="field-error" data-error="category"></span>
    <label>Title<input name="title" value="${esc(v.title)}" placeholder="e.g. Algorithms final exam review"></label><span class="field-error" data-error="title"></span>
    <label>Description <span class="hint">(optional)</span><textarea name="description" rows="2" placeholder="What is the goal of this collaboration?">${esc(v.description)}</textarea></label>
    <div class="row-3">
      <div><label>Date</label><div class="date-select" data-group="date">
        <select name="dDay" aria-label="Day"><option value="">Day</option>${Array.from({length:31},(_,i)=>{const x=String(i+1).padStart(2,"0");return `<option value="${x}" ${sel(x,dd)}>${i+1}</option>`;}).join("")}</select>
        <select name="dMonth" aria-label="Month"><option value="">Month</option>${MONTHS.map((m,i)=>{const x=String(i+1).padStart(2,"0");return `<option value="${x}" ${sel(x,mm)}>${m}</option>`;}).join("")}</select>
        <select name="dYear" aria-label="Year"><option value="">Year</option>${[0,1].map(k=>String(new Date().getFullYear()+k)).map(y=>`<option ${sel(y,yy)}>${y}</option>`).join("")}</select>
      </div><span class="field-error" data-error="date"></span></div>
      <div><label>Location type<select name="locationType"><option value="">Select…</option><option ${sel("Online",v.locationType)}>Online</option><option ${sel("Offline",v.locationType)}>Offline</option></select></label><span class="field-error" data-error="locationType"></span></div>
      <div><label>Place / platform<input name="location" value="${esc(v.location)}" placeholder="e.g. Building 7 or Teams"></label><span class="field-error" data-error="location"></span></div>
    </div>
    <label>Needed roles <span class="hint">(press Enter to add)</span></label>
    <div class="role-input"><div id="roles" class="chips"></div><input id="role-entry" placeholder="e.g. Front-end Developer"></div>
    <span class="field-error" data-error="roles"></span>
    <div class="row-2">
      <div><label>Maximum group size <span class="hint">(including you)</span><input type="number" name="maxSize" min="2" max="10" value="${v.maxSize}"></label><span class="field-error" data-error="maxSize"></span></div>
      <div><label>Looking for</label><div class="pill-group">
        <label class="pill-radio"><input type="radio" name="seeking" value="Partner" ${v.seeking === "Partner" ? "checked" : ""}><span>A partner</span></label>
        <label class="pill-radio"><input type="radio" name="seeking" value="Team" ${v.seeking === "Team" ? "checked" : ""}><span>A team</span></label></div>
        <span class="field-error" data-error="seeking"></span></div>
    </div>
    <div class="actions"><a class="btn ghost" href="${ex ? "#/request/" + ex.id : "#/browse"}">Cancel</a><button class="btn primary" type="submit">${ex ? "Save changes" : "Publish request"}</button></div>
  </form>`;
  const roles = [...v.roles];
  const drawRoles = () => $("#roles").innerHTML = roles.map((r, i) => `<span class="chip role">${esc(r)}<button type="button" data-i="${i}" aria-label="remove">×</button></span>`).join("");
  drawRoles();
  $("#role-entry").onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); const x = e.target.value.trim(); if (x && !roles.includes(x)) { roles.push(x); drawRoles(); $('[data-error="roles"]').textContent = ""; } e.target.value = ""; }
  };
  $("#roles").onclick = e => { if (e.target.dataset.i) { roles.splice(+e.target.dataset.i, 1); drawRoles(); } };
  const form = $("#req-form");
  form.onsubmit = e => {
    e.preventDefault();
    const pending = $("#role-entry").value.trim(); if (pending && !roles.includes(pending)) { roles.push(pending); drawRoles(); $("#role-entry").value = ""; }
    const val = n => (form.querySelector(`[name="${n}"]:checked`) || {}).value || "";
    const data = { category: val("category"), title: form.title.value, description: form.description.value,
      date: readDate(form), locationType: form.locationType.value, location: form.location.value, roles, maxSize: form.maxSize.value, seeking: val("seeking") };
    const res = ex ? Store.updateRequest(ex.id, data) : Store.createRequest(data);
    if (!res.ok) { showErrors(form, res.errors); toast("Please fix the highlighted fields.", "err"); return; }
    toast(ex ? "Changes saved ✔" : "Request published ✔");
    location.hash = "#/request/" + res.request.id;
  };
}

function readDate(form) {
  const d = form.dDay.value, m = form.dMonth.value, y = form.dYear.value;
  if (!d || !m || !y) return "";
  const iso = `${y}-${m}-${d}`;
  const dt = new Date(iso + "T00:00:00");
  return dt.getMonth() + 1 === +m ? iso : "invalid";
}

/* ---------------- PB-04: browse & filter ---------------- */
let browseState = { category: "All", query: "" };
function viewBrowse() {
  const tabs = ["All", ...Store.CATEGORIES].map(c => `<button class="tab ${browseState.category === c ? "on" : ""}" data-cat="${c}">${c === "All" ? "All" : CAT_ICON[c] + " " + c}</button>`).join("");
  const soon = Store.myCollaborations().filter(r => r.status !== "Completed" && Store.daysUntil(r.date) >= 0 && Store.daysUntil(r.date) <= 2);
  view().innerHTML = `
  ${soon.length ? `<div class="reminder">⏰ <b>Coming up:</b> ${soon.map(r => `<a href="#/request/${r.id}">${esc(r.title)}</a> (${whenText(r.date)})`).join(" · ")}</div>` : ""}
  <div class="page-head"><div><h1>Active Collaboration Requests</h1><p class="muted">Find a study session, hackathon team or graduation project that fits you.</p></div>
    <a class="btn primary" href="#/create">+ New request</a></div>
  <div class="filters"><div class="tabs">${tabs}</div>
    <input class="search" id="search" placeholder="Search by title, role or keyword…" value="${esc(browseState.query)}"></div>
  <p class="muted small" id="count"></p>
  <div class="cards" id="list"></div>`;
  view().querySelectorAll(".tab").forEach(b => b.onclick = () => { browseState.category = b.dataset.cat; viewBrowse(); });
  $("#search").oninput = e => { browseState.query = e.target.value; drawList(); };
  drawList();
}
function whenText(iso) { const n = Store.daysUntil(iso); return n === 0 ? "today" : n === 1 ? "tomorrow" : n > 1 ? `in ${n} days` : fmtDate(iso); }
const STATUS_BADGE = { Pending: "pending", Accepted: "ok", Declined: "no", Withdrawn: "muted-b", Open: "ok", Confirmed: "ok", Full: "full", Closed: "muted-b", Completed: "done" };
function badge(s, big) { return `<span class="badge st-${STATUS_BADGE[s] || "pending"}${big ? " big" : ""}">${s}</span>`; }
function requestCard(r) {
  const owner = Store.getUser(r.ownerId);
  const st = Store.joinStatus(r.id);
  const mine = r.ownerId === (Store.currentUser() || {}).id;
  const left = r.maxSize - Store.memberCount(r.id);
  return `<article class="req-card" onclick="location.hash='#/request/${r.id}'">
    <div class="req-top"><span class="badge ${CAT_CLASS[r.category]}">${CAT_ICON[r.category]} ${r.category}</span>
      ${mine ? `<span class="badge mine">Your request</span>` : st ? badge(st) : ""}</div>
    <h3>${esc(r.title)}</h3>
    <p class="meta">📅 ${fmtDate(r.date)}<br>📍 ${esc(r.locationType)} · ${esc(r.location)}</p>
    <div class="chips">${r.roles.map(x => `<span class="chip role">${esc(x)}</span>`).join("")}</div>
    <div class="req-foot"><span class="owner"><span class="avatar xs">${esc(initials(owner.name))}</span>${esc(owner.name)}</span>
      <span class="muted small">Seeking a ${r.seeking.toLowerCase()} · ${left} spot${left === 1 ? "" : "s"} left of ${r.maxSize}</span></div>
  </article>`;
}
function drawList() {
  const list = Store.listActive(browseState);
  $("#count").textContent = `${list.length} active request${list.length === 1 ? "" : "s"}`;
  $("#list").innerHTML = list.length ? list.map(requestCard).join("") :
    `<div class="card empty"><h3>No active requests found</h3><p class="muted">Try another category or keyword, or create your own request.</p></div>`;
}

/* ---------------- PB-05/06/07/08/10/15/20: request details ---------------- */
function viewRequest(id) {
  const r = Store.getRequest(id);
  if (!r) { view().innerHTML = `<div class="card empty"><h2>Request not found</h2><a class="btn" href="#/browse">Back to browse</a></div>`; return; }
  const me = Store.currentUser();
  const owner = Store.getUser(r.ownerId);
  const mine = r.ownerId === me.id;
  const st = Store.joinStatus(r.id);
  const applicants = Store.applicantsFor(r.id).filter(a => a.status !== "Withdrawn");
  const members = Store.membersOf(r.id);
  const count = members.length, full = count >= r.maxSize;
  let action;
  if (mine) {
    const pend = applicants.filter(a => a.status === "Pending").length;
    action = `<p class="eyebrow">Owner tools</p>
      <div class="status-row">${badge(r.status, true)}<span class="muted">${count}/${r.maxSize} members · ${pend} pending</span></div>
      <div class="tool-btns">
        ${["Open", "Full"].includes(r.status) ? `<a class="btn" href="#/edit/${r.id}">✏️ Edit request</a>` : ""}
        ${["Open", "Full"].includes(r.status) ? `<button class="btn" id="close-req">🔒 Close request</button>` : ""}
        ${r.status !== "Completed" && r.status !== "Closed" ? `<button class="btn primary" id="complete-req">✅ Mark as completed</button>` : ""}
      </div>`;
  } else if (st === "Accepted") action = `<div class="status-box">${badge("Accepted", true)}<p class="muted">You are a member of this collaboration. It appears in <a href="#/collabs">My Collaborations</a>.</p></div>`;
  else if (st === "Declined") action = `<div class="status-box">${badge("Declined", true)}<p class="muted">The owner declined this join request.</p></div>`;
  else if (st === "Pending") action = `<div class="status-box">${badge("Pending", true)}<p class="muted">Your join request stays pending until ${esc(owner.name.split(" ")[0])} responds.</p>
      <button class="btn ghost full" id="withdraw">↩️ Withdraw my request</button></div>`;
  else if (r.status === "Full") action = `<div class="notice">This team is full (${count}/${r.maxSize} members).</div>`;
  else if (r.status !== "Open") action = `<div class="notice">This request is ${r.status.toLowerCase()}.</div>`;
  else if (!Store.isProfileComplete(me)) action = `<div class="notice">Complete <a href="#/profile">your profile</a> before sending a join request.</div>`;
  else action = `<form id="join-form"><label>Message to the owner <span class="hint">(optional)</span>
      <textarea name="message" rows="2" placeholder="Why are you a good fit?"></textarea></label>
      <button class="btn primary full" type="submit">Send join request</button></form>`;
  const appList = mine ? `<h4>Join requests (${applicants.length})</h4>${applicants.length ? `<ul class="applicants">${applicants.map(a => `
      <li><span class="avatar xs">${esc(initials(a.user.name))}</span><div class="ap-main"><b>${esc(a.user.name)}</b>
        <span class="muted small">${esc(a.user.major)} · ${esc(a.user.level)} · ${a.user.techSkills.slice(0, 3).map(esc).join(", ")}</span>
        ${a.message ? `<span class="ap-msg">“${esc(a.message)}”</span>` : ""}</div>
        <div class="ap-act"><a class="btn sm" href="#/student/${a.user.id}?req=${r.id}">View profile</a>
        ${a.status === "Pending" ? `<button class="btn sm primary" data-acc="${a.id}" ${full ? "disabled title='Team is full'" : ""}>Accept</button><button class="btn sm danger" data-dec="${a.id}">Decline</button>` : badge(a.status)}</div></li>`).join("")}</ul>` : `<p class="muted">No join requests yet.</p>`}` : "";
  view().innerHTML = `
  <a class="back" href="#/browse">← Back to requests</a>
  <div class="grid-2">
    <div class="card">
      <span class="badge ${CAT_CLASS[r.category]}">${CAT_ICON[r.category]} ${r.category}</span> ${!mine ? badge(r.status) : ""}
      <h1 class="req-title">${esc(r.title)}</h1>
      <p>${esc(r.description || "No description provided.")}</p>
      <dl class="facts wide">
        <div><dt>Date</dt><dd>${fmtDate(r.date)}</dd></div>
        <div><dt>Location</dt><dd>${esc(r.locationType)} · ${esc(r.location)}</dd></div>
        <div><dt>Looking for</dt><dd>A ${r.seeking.toLowerCase()}</dd></div>
        <div><dt>Team</dt><dd>${count} of ${r.maxSize} members</dd></div>
      </dl>
      <div class="meter"><span style="width:${Math.min(100, count / r.maxSize * 100)}%"></span></div>
      <h4>Needed roles</h4><div class="chips">${r.roles.map(x => `<span class="chip role">${esc(x)}</span>`).join("")}</div>
      <h4>Members</h4><div class="chips">${members.map(m => `<span class="chip member"><span class="avatar xs">${esc(initials(m.name))}</span>${esc(m.name)}${m.id === r.ownerId ? " (owner)" : ""}</span>`).join("")}</div>
      ${appList}
    </div>
    <aside>
      <div class="card">${action}</div>
      <div class="card"><p class="eyebrow">Posted by</p>${profileCard(owner)}</div>
    </aside>
  </div>`;
  const jf = $("#join-form");
  if (jf) jf.onsubmit = e => {
    e.preventDefault();
    const res = Store.sendJoinRequest(r.id, jf.message.value);
    if (!res.ok) { toast(res.error, "err"); return; }
    toast("Join request sent ✔"); router();
  };
  const w = $("#withdraw"); if (w) w.onclick = () => { if (!confirm("Withdraw your join request?")) return; const res = Store.withdrawJoin(r.id); toast(res.ok ? "Join request withdrawn" : res.error, res.ok ? "ok" : "err"); router(); };
  view().querySelectorAll("[data-acc]").forEach(b => b.onclick = () => { const res = Store.decideJoin(b.dataset.acc, "Accepted"); if (!res.ok) return toast(res.error, "err"); toast(res.full ? "Accepted ✔ – the team is now full" : "Member accepted ✔"); router(); });
  view().querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { const res = Store.decideJoin(b.dataset.dec, "Declined"); if (!res.ok) return toast(res.error, "err"); toast("Join request declined"); router(); });
  const cr = $("#close-req"); if (cr) cr.onclick = () => { if (!confirm("Close this request? Pending applicants will be notified.")) return; Store.closeRequest(r.id); toast("Request closed"); router(); };
  const cp = $("#complete-req"); if (cp) cp.onclick = () => { if (!confirm("Mark this collaboration as completed?")) return; const res = Store.completeCollaboration(r.id); if (!res.ok) return toast(res.error, "err"); toast("Collaboration completed ✅"); router(); };
}

/* ---------------- PB-06: applicant profile ---------------- */
function viewStudent(id, reqId) {
  const u = Store.getUser(id);
  if (!u) { view().innerHTML = `<div class="card empty"><h2>Student not found</h2></div>`; return; }
  const join = reqId ? Store.applicantsFor(reqId).find(a => a.user.id === id && a.status !== "Withdrawn") : null;
  const r = reqId ? Store.getRequest(reqId) : null;
  const canDecide = join && join.status === "Pending" && r && r.ownerId === Store.currentUser().id;
  view().innerHTML = `
  ${reqId ? `<a class="back" href="#/request/${reqId}">← Back to the request</a>` : `<a class="back" href="#/browse">← Back</a>`}
  <div class="grid-2">
    <div class="card">${profileCard(u)}
      <p class="muted small" style="margin-top:14px">Completed collaborations on StackLink: <b>${u.completedCount || 0}</b></p></div>
    ${join ? `<aside class="card"><p class="eyebrow">Join request for</p><h3>${esc(r.title)}</h3>
      ${join.message ? `<p class="ap-msg">“${esc(join.message)}”</p>` : `<p class="muted">No message.</p>`}
      <div class="status-row">${badge(join.status)}<span class="muted small">Sent ${new Date(join.createdAt).toLocaleDateString("en-GB")}</span></div>
      ${canDecide ? `<div class="tool-btns"><button class="btn primary" id="acc">Accept</button><button class="btn danger" id="dec">Decline</button></div>` : ""}</aside>` : ""}
  </div>`;
  if (canDecide) {
    $("#acc").onclick = () => { const res = Store.decideJoin(join.id, "Accepted"); if (!res.ok) return toast(res.error, "err"); toast("Member accepted ✔"); location.hash = "#/request/" + reqId; };
    $("#dec").onclick = () => { Store.decideJoin(join.id, "Declined"); toast("Join request declined"); location.hash = "#/request/" + reqId; };
  }
}

/* ---------------- PB-12 + PB-14: my collaborations ---------------- */
function viewCollabs() {
  const list = Store.myCollaborations();
  const upcoming = list.filter(r => r.status !== "Completed"), done = list.filter(r => r.status === "Completed");
  const row = r => {
    const n = Store.daysUntil(r.date), soon = r.status !== "Completed" && n >= 0 && n <= 2;
    return `<li class="collab ${soon ? "soon" : ""}"><div class="cal"><b>${new Date(r.date + "T00:00:00").getDate()}</b><span>${MONTHS[new Date(r.date + "T00:00:00").getMonth()]}</span></div>
      <div class="c-main"><a href="#/request/${r.id}"><b>${esc(r.title)}</b></a>
      <span class="muted small">${CAT_ICON[r.category]} ${r.category} · 📍 ${esc(r.locationType)} · ${esc(r.location)} · 👥 ${Store.memberCount(r.id)} members</span></div>
      ${soon ? `<span class="badge st-pending">⏰ ${whenText(r.date)}</span>` : badge(r.status === "Completed" ? "Completed" : "Confirmed")}</li>`;
  };
  view().innerHTML = `
  <div class="page-head"><div><h1>My Collaborations</h1><p class="muted">Confirmed collaborations where you are the owner or an accepted member.</p></div></div>
  <div class="card"><h2>Upcoming</h2>${upcoming.length ? `<ul class="collab-list">${upcoming.map(row).join("")}</ul>` : `<p class="muted">No confirmed collaborations yet. When an owner accepts you, or you accept a member, it appears here.</p>`}</div>
  <div class="card"><h2>Completed</h2>${done.length ? `<ul class="collab-list">${done.map(row).join("")}</ul>` : `<p class="muted">No completed collaborations yet.</p>`}</div>`;
}

/* ---------------- PB-09: notifications ---------------- */
function viewNotifications() {
  const list = Store.myNotifications();
  view().innerHTML = `
  <div class="page-head"><div><h1>Notifications</h1><p class="muted">Join requests, decisions, reminders and updates.</p></div></div>
  <div class="card">${list.length ? `<ul class="notif-list">${list.map(n => `<li class="${n.read ? "" : "unread"}"><a href="${n.link}">${esc(n.text)}</a><span class="muted small">${timeAgo(n.createdAt)}</span></li>`).join("")}</ul>` : `<p class="muted">You have no notifications yet.</p>`}</div>`;
  Store.markAllRead(); setTimeout(renderHeader, 1200);
}
function timeAgo(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " h ago";
  return Math.round(h / 24) + " d ago";
}

/* ---------------- my activity ---------------- */
function viewActivity() {
  const mine = Store.myRequests();
  const joins = Store.myJoinRequests();
  view().innerHTML = `
  <div class="page-head"><div><h1>My Activity</h1><p class="muted">Your requests and the collaborations you asked to join.</p></div></div>
  <div class="grid-2 even">
    <div class="card"><h2>My collaboration requests</h2>
      ${mine.length ? `<ul class="act-list">${mine.map(r => `<li><a href="#/request/${r.id}">${esc(r.title)}</a>${badge(r.status)}<span class="muted small">${Store.memberCount(r.id)}/${r.maxSize} members · ${Store.applicantsFor(r.id).filter(a => a.status === "Pending").length} pending</span></li>`).join("")}</ul>` : `<p class="muted">You have not created any requests yet.</p><a class="btn" href="#/create">Create a request</a>`}
    </div>
    <div class="card"><h2>My join requests</h2>
      ${joins.length ? `<ul class="act-list">${joins.map(j => `<li><a href="#/request/${j.request.id}">${esc(j.request.title)}</a>${badge(j.status)}<span class="muted small">Sent ${new Date(j.createdAt).toLocaleDateString("en-GB")}</span>${j.status === "Pending" ? `<button class="btn sm ghost" data-wd="${j.request.id}">Withdraw</button>` : ""}</li>`).join("")}</ul>` : `<p class="muted">You have not sent any join requests yet.</p><a class="btn" href="#/browse">Browse requests</a>`}
    </div>
  </div>`;
  view().querySelectorAll("[data-wd]").forEach(b => b.onclick = () => { if (!confirm("Withdraw your join request?")) return; Store.withdrawJoin(b.dataset.wd); toast("Join request withdrawn"); router(); });
}

/* ---------------- router ---------------- */
function router() {
  const [path, query] = (location.hash || "#/browse").slice(2).split("?");
  const parts = path.split("/");
  const params = new URLSearchParams(query || "");
  const u = Store.currentUser();
  if (!u && parts[0] !== "login") { location.hash = "#/login"; return; }
  if (u && parts[0] === "login") { location.hash = "#/browse"; return; }
  if (u) Store.generateReminders();          // PB-14
  renderHeader();
  window.scrollTo(0, 0);
  switch (parts[0]) {
    case "login": return viewLogin();
    case "profile": return viewProfile();
    case "create": return viewRequestForm();
    case "edit": return viewRequestForm(parts[1]);
    case "request": return viewRequest(parts[1]);
    case "student": return viewStudent(parts[1], params.get("req"));
    case "collabs": return viewCollabs();
    case "notifications": return viewNotifications();
    case "activity": return viewActivity();
    default: return viewBrowse();
  }
}
window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", () => {
  $("#reset").onclick = e => { e.preventDefault(); if (confirm("Reset all demo data?")) { Store.reset(); location.hash = "#/login"; router(); } };
  router();
});

</script>
</body>
